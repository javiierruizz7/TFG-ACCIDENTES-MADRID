[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "madrid-accidents"
version = "0.1.0"
description = "TFG: predicción espaciotemporal de accidentes de tráfico en Madrid (CPU, E0-E5)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "pydantic",
    "PyYAML",
    "typer",
    "geopandas",
    "shapely",
    "pyproj",
    "scipy",
    "statsmodels",
    "scikit-learn",
    "lightgbm",
    "optuna",
    "shap",
    "matplotlib",
    "seaborn",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jupyterlab"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
